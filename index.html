<!DOCTYPE html>
<html>
<head>
    <title>Import Tracker</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        /* Simple styling – we'll improve later */
        body { font-family: Arial; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .dashboard { display: flex; gap: 20px; margin-bottom: 20px; }
        .card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; min-width: 150px; }
        button { margin: 5px; padding: 5px 10px; cursor: pointer; }
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border: 1px solid #ccc; z-index: 1000; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
    </style>
</head>
<body>
    <h1>Import Tracker Dashboard</h1>
    <div class="dashboard" id="dashboard">
        <div class="card">Total Shipments: <span id="totalShipments">0</span></div>
        <div class="card">Total Logistics Cost (OMR): <span id="totalCost">0</span></div>
        <div class="card">Avg Transit Days: <span id="avgTransit">0</span></div>
    </div>
    <div>
        <button id="addBtn">Add Shipment</button>
        <button id="pdfBtn">Export PDF</button>
    </div>
    <div style="overflow-x: auto;">
        <table id="dataTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- Modal for add/edit -->
    <div id="modalOverlay" class="overlay"></div>
    <div id="modal" class="modal">
        <h2 id="modalTitle">Add Shipment</h2>
        <form id="shipmentForm">
            <!-- Fields will be generated dynamically -->
            <div id="formFields"></div>
            <button type="submit">Save</button>
            <button type="button" id="cancelBtn">Cancel</button>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
